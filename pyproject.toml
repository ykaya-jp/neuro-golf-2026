[project]
name = "neurogolf-2026"
version = "0.0.1"
description = "Kaggle CV competition: neurogolf-2026"
requires-python = ">=3.11"
dependencies = [
    "kagglib",
    "kaggle>=1.6",
    "numpy>=1.26",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=15.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "mlflow>=2.16",
    "optuna>=4.0",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "duckdb>=1.0",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    # Vision-specific
    "torch>=2.4",
    "torchvision>=0.19",
    "lightning>=2.4",
    "timm>=1.0",
    "albumentations>=1.4",
    "opencv-python-headless>=4.10",
    "pillow>=10.0",
    "ultralytics>=8.3",     # YOLO
    "transformers>=4.45",   # ViT/Swin/Qwen-VL も触れるように
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=4.0",
    "nbstripout>=0.7",
]

[tool.uv.sources]
kagglib = { path = "../_shared/kagglib", editable = true }
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neurogolf_2026"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
